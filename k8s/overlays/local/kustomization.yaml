---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{NAMESPACE}}
resources:
  - ./namespace.yaml
  - ./database-secret.yaml
  - ./pgweb.yaml
  - ./krun-debug.yaml
  - ./rabbitmq-secret.yaml
  - ./../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: remove
        path: /spec/template/spec/containers/0/resources
  - target:
      kind: Deployment
      name: applicationname-worker
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/startupProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      kind: Deployment
      name: applicationname-api
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/startupProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      kind: NetworkPolicy
      name: applicationname-database
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              app: applicationname-pgweb
images:
  - name: applicationname-worker
    newName: registry:5000/applicationname-worker
    newTag: latest
  - name: applicationname-api
    newName: registry:5000/applicationname-api
    newTag: latest
  - name: applicationname-web
    newName: registry:5000/applicationname-web
    newTag: latest
