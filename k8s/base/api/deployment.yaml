---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicationname-api
  labels:
    app: applicationname-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: applicationname-api
  template:
    metadata:
      labels:
        app: applicationname-api
      annotations:
        prometheus.io.scrape: 'true'
    spec:
      serviceAccountName: applicationname
      automountServiceAccountToken: false
      containers:
        - name: applicationname-api
          image: applicationname-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 20000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: rabbitmq__host
              value: {{RABBITMQ_HOST}}
            - name: rabbitmq__username
              valueFrom:
                secretKeyRef:
                  name: applicationname-rabbitmq
                  key: username
            - name: rabbitmq__password
              valueFrom:
                secretKeyRef:
                  name: applicationname-rabbitmq
                  key: password
            - name: valkey__connection-string
              value: 'applicationname-cache:6379'
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          resources:
            limits:
              memory: 100Mi
              cpu: 100m
            requests:
              memory: 30Mi
              cpu: 10m
